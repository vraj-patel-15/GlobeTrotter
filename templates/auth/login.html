<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login - GlobalTrotters</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 w-full max-w-md">
        <h2 class="text-2xl font-bold text-slate-900 text-center">Welcome Back</h2>
        <p class="text-slate-500 text-center text-sm mb-6">Log in to manage your multi-city trips</p>
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
                <input type="email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input type="password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Log In</button>
        </form>
        <p class="text-xs text-center text-slate-500 mt-4">Don't have an account? <a href="/auth/register" class="text-blue-600 font-semibold">Sign Up</a></p>
    </div>
</body>
</html>
