{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">My Trips</h1>
    <a href="/trips/create" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">+ Add Trip</a>
</div>
<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Card Item -->
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div class="h-32 bg-slate-300"></div>
        <div class="p-4">
            <h3 class="font-bold text-lg">Euro Odyssey 2026</h3>
            <p class="text-xs text-slate-500">Sept 1 - Sept 14, 2026</p>
            <p class="text-xs font-semibold text-emerald-600 mt-2">Budget: $3,000</p>
            <div class="mt-4 flex gap-2">
                <a href="/itinerary/builder" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded font-medium">Edit Plan</a>
                <a href="/itinerary/view" class="text-xs bg-blue-50 text-blue-600 px-3 py-2 rounded font-medium">View Itinerary</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
