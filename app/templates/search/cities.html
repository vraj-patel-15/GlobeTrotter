{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
    <input type="text" placeholder="Search cities or countries..." class="w-full p-4 border rounded-xl text-sm">
    <div class="grid md:grid-cols-3 gap-6">
        <div class="bg-white rounded-xl border overflow-hidden">
            <div class="h-32 bg-slate-200"></div>
            <div class="p-4">
                <h3 class="font-bold">Tokyo, Japan</h3>
                <p class="text-xs text-slate-500">Cost Index: $$$$</p>
                <button class="mt-3 w-full bg-slate-100 text-xs font-semibold py-2 rounded">+ Add to Trip</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
