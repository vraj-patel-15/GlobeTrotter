{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded-xl border border-slate-200">
    <h1 class="text-xl font-bold mb-4">User Settings</h1>
    <div class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Full Name</label>
            <input type="text" value="John Doe" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Preferred Currency</label>
            <select class="w-full px-3 py-2 border rounded-lg text-sm"><option>USD ($)</option><option>EUR (€)</option></select>
        </div>
    </div>
</div>
{% endblock %}
