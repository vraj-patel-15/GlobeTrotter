<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GlobalTrotters{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/dashboard" class="flex items-center gap-2 font-bold text-xl text-blue-600">
                <i class="fa-solid fa-plane-departure"></i> GlobalTrotters
            </a>
            <div class="hidden md:flex gap-6 font-medium text-slate-600 text-sm">
                <a href="/dashboard" class="hover:text-blue-600">Dashboard</a>
                <a href="/trips/list" class="hover:text-blue-600">My Trips</a>
                <a href="/search/cities" class="hover:text-blue-600">Explore Cities</a>
                <a href="/community" class="hover:text-blue-600">Community</a>
            </div>
            <div class="flex items-center gap-3">
                <a href="/trips/create" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">+ New Trip</a>
                <a href="/profile" class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 font-bold text-sm">JS</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/itinerary.js') }}"></script>
    <script src="{{ url_for('static', filename='js/search.js') }}"></script>
    <script src="{{ url_for('static', filename='js/budget.js') }}"></script>
    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        © 2026 GlobalTrotters Inc. All rights reserved.
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
