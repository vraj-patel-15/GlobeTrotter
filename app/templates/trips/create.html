{% extends "base.html" %}
{% block title %}Create New Trip - GlobalTrotters{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl border border-slate-200">
    <h1 class="text-xl font-bold mb-6">Start a New Adventure</h1>
    <form action="/trips/create" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Trip Title</label>
            <input type="text" placeholder="e.g. Euro Summer 2026" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Start Date</label>
                <input type="date" class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">End Date</label>
                <input type="date" class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Budget Target ($)</label>
            <input type="number" placeholder="3000" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <button class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium text-sm">Save & Continue to Builder</button>
    </form>
</div>
{% endblock %}
