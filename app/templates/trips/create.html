{% extends "base.html" %}
{% block title %}{% if is_edit %}Edit Trip{% else %}Start a New Adventure{% endif %} - GlobeTrotter{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
    <h1 class="text-xl font-bold mb-6 text-slate-900">
        {% if is_edit %}Edit Trip Details{% else %}Start a New Adventure{% endif %}
    </h1>

    <form action="{% if is_edit %}{{ url_for('trips.edit', trip_id=trip.id) }}{% else %}{{ url_for('trips.create') }}{% endif %}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Trip Title *</label>
            <input type="text" name="title" required value="{{ trip.title if is_edit and trip else '' }}" placeholder="e.g. Euro Summer 2026" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Start Date *</label>
                <input type="date" name="start_date" required value="{{ trip.start_date if is_edit and trip else '' }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">End Date *</label>
                <input type="date" name="end_date" required value="{{ trip.end_date if is_edit and trip else '' }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Description</label>
            <textarea name="description" rows="3" placeholder="Brief summary of your trip..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">{{ trip.description if is_edit and trip else '' }}</textarea>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Budget Target ($)</label>
            <input type="number" step="0.01" name="budget" value="{{ trip.budget if is_edit and trip else '' }}" placeholder="3000" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="flex items-center gap-2 pt-2">
            <input type="checkbox" id="is_public" name="is_public" {% if is_edit and trip and trip.is_public %}checked{% endif %} class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <label for="is_public" class="text-sm text-slate-700 font-medium">Make this trip public to the community</label>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium text-sm transition-colors mt-4">
            {% if is_edit %}Save Changes{% else %}Save & Continue to Builder{% endif %}
        </button>
    </form>
</div>
{% endblock %}
