{% extends "base.html" %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Left Column: City Order -->
    <div class="bg-white p-5 rounded-xl border border-slate-200">
        <h2 class="font-bold text-lg mb-4">Route Builder</h2>
        <div class="space-y-3">
            <div class="p-3 bg-slate-50 rounded-lg border flex justify-between items-center">
                <div><p class="font-bold text-sm">1. Paris, France</p><p class="text-xs text-slate-400">3 Days</p></div>
                <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded">Edit</span>
            </div>
        </div>
        <button class="w-full mt-4 border-2 border-dashed border-slate-300 text-slate-500 py-2 rounded-lg text-sm font-semibold">+ Add Stop</button>
    </div>
    
    <!-- Right Column: Timeline Grid -->
    <div class="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200">
        <h2 class="font-bold text-lg mb-4">Daily Schedule</h2>
        <p class="text-sm text-slate-500">Drag activities into scheduled slots.</p>
    </div>
</div>
{% endblock %}
