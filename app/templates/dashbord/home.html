{% extends "base.html" %}
{% block title %}Dashboard - GlobalTrotters{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Welcome back, John! 👋</h1>
            <p class="text-slate-500 text-sm">You have 1 active upcoming trip.</p>
        </div>
        <a href="/trips/create" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium text-sm">+ Create New Trip</a>
    </div>

    <!-- Stats Overview -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-xl border border-slate-200">
            <span class="text-xs font-bold text-slate-400 uppercase">Upcoming Trips</span>
            <p class="text-2xl font-bold mt-1">2</p>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200">
            <span class="text-xs font-bold text-slate-400 uppercase">Total Spent</span>
            <p class="text-2xl font-bold text-emerald-600 mt-1">$2,620.00</p>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200">
            <span class="text-xs font-bold text-slate-400 uppercase">Countries Visited</span>
            <p class="text-2xl font-bold text-blue-600 mt-1">14</p>
        </div>
    </div>
</div>
{% endblock %}
